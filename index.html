<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Fitnesstracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 Mein Fitnesstracker</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <nav class="tabs">
            <button class="tab active" onclick="showTab('eingabe')">📝 Eingabe</button>
            <button class="tab" onclick="showTab('verlauf')">📊 Verlauf</button>
            <button class="tab" onclick="showTab('statistik')">📈 Statistik</button>
        </nav>

        <!-- TAB: Eingabe -->
        <div id="tab-eingabe" class="tab-content active">
            <div class="card">
                <h2>Daten für heute eingeben</h2>
                <form id="dataForm">
                    <div class="form-group">
                        <label for="date">📅 Datum:</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="weight">⚖️ Gewicht (kg):</label>
                        <input type="number" id="weight" step="0.1" placeholder="z.B. 75.5">
                    </div>

                    <div class="form-group">
                        <label for="stress">😰 Stress (1-10):</label>
                        <input type="number" id="stress" min="1" max="10" placeholder="1 = entspannt, 10 = sehr gestresst">
                    </div>

                    <div class="form-group">
                        <label for="steps">👟 Schritte:</label>
                        <input type="number" id="steps" placeholder="z.B. 10000">
                    </div>

                    <div class="form-group">
                        <label for="calories">🔥 Kalorien:</label>
                        <input type="number" id="calories" placeholder="z.B. 2000">
                    </div>

                    <div class="form-group">
                        <label for="protein">🥩 Protein (g):</label>
                        <input type="number" id="protein" placeholder="z.B. 150">
                    </div>

                    <div class="form-group">
                        <label for="exercise">🏋️ Sport (Minuten):</label>
                        <input type="number" id="exercise" placeholder="z.B. 60">
                    </div>

                    <div class="form-group">
                        <label for="water">💧 Wasser (Liter):</label>
                        <input type="number" id="water" step="0.1" placeholder="z.B. 2.5">
                    </div>

                    <div class="form-group">
                        <label for="notes">📝 Notizen:</label>
                        <textarea id="notes" rows="3" placeholder="Optional: Wie war dein Tag?"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">💾 Speichern</button>
                </form>
            </div>
        </div>

        <!-- TAB: Verlauf -->
        <div id="tab-verlauf" class="tab-content">
            <div class="card">
                <h2>Deine Einträge</h2>
                <div id="entriesList"></div>
            </div>
        </div>

        <!-- TAB: Statistik -->
        <div id="tab-statistik" class="tab-content">
            <div class="card">
                <h2>Statistiken (Letzte 30 Tage)</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>⚖️ Gewicht</h3>
                        <canvas id="weightChart"></canvas>
                    </div>
                    <div class="stat-card">
                        <h3>😰 Stress</h3>
                        <canvas id="stressChart"></canvas>
                    </div>
                    <div class="stat-card">
                        <h3>👟 Schritte</h3>
                        <canvas id="stepsChart"></canvas>
                    </div>
                    <div class="stat-card">
                        <h3>🥩 Protein</h3>
                        <canvas id="proteinChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <button class="btn btn-danger" onclick="exportData()">📥 Daten exportieren</button>
            <button class="btn btn-secondary" onclick="importData()">📤 Daten importieren</button>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
