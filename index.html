<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Health Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #dbeafe 100%); min-height: 100vh; padding: 1rem; }
        .card { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 1rem; margin-bottom: 1rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .title { font-size: 1.25rem; font-weight: bold; color: #1f2937; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
        .stat-box { padding: 0.5rem; border-radius: 0.5rem; }
        .stat-box.green { background: #f0fdf4; }
        .stat-box.blue { background: #eff6ff; }
        .stat-box.orange { background: #fffbeb; }
        .stat-label { font-size: 0.75rem; color: #4b5563; }
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .stat-value.green { color: #16a34a; }
        .stat-value.blue { color: #2563eb; }
        .stat-value.orange { color: #f59e0b; }
        .stat-sub { font-size: 0.75rem; color: #6b7280; }
        .btn-green { background: #22c55e; color: white; width: 100%; padding: 0.625rem; font-size: 1rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
        .btn-gray { background: #d1d5db; color: #6b7280; width: 100%; padding: 0.625rem; font-size: 1rem; border: none; border-radius: 0.5rem; cursor: not-allowed; }
        .btn-toggle { background: white; width: 100%; padding: 0.75rem; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; cursor: pointer; border: none; margin-bottom: 1rem; }
        .label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.375rem; color: #374151; }
        .input-date { width: 100%; padding: 0.5rem; border: 2px solid #d1d5db; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; }
        .questions { display: flex; flex-direction: column; gap: 0.5rem; }
        .question-row { display: flex; align-items: center; gap: 0.5rem; }
        .question-row.faded { opacity: 0.75; }
        .emoji { font-size: 1.4rem; width: 1.8rem; text-align: center; flex-shrink: 0; }
        .question-label { font-size: 0.9rem; color: #374151; font-weight: 600; min-width: 5rem; flex-shrink: 0; }
        .buttons { display: flex; flex: 1; gap: 0.3rem; }
        .q-btn { flex: 1; border: 2px solid #d1d5db; border-radius: 0.35rem; padding: 0.15rem 0.2rem; font-weight: 700; background: white; cursor: pointer; font-size: 1rem; }
        .q-btn.green { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
        .q-btn.red { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
        .q-btn.low { border-color: #10b981; background: #d1fae5; color: #065f46; }
        .q-btn.medium { border-color: #f59e0b; background: #fef3c7; color: #92400e; }
        .q-btn.high { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
        .q-btn.prot-low { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
        .q-btn.prot-med { border-color: #f59e0b; background: #fef3c7; color: #92400e; }
        .q-btn.prot-high { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
        .stats-mini { font-size: 1.1rem; white-space: nowrap; min-width: 7.5rem; text-align: right; flex-shrink: 0; font-weight: 800; color: #16a34a; }
        .stats-count .good { color: #16a34a; font-weight: 900; font-size: 1.2rem; }
        .stats-count .bad { color: #ef4444; font-weight: 900; font-size: 1.2rem; }
        .sport-details { margin-left: 2.3rem; margin-top: 0.5rem; padding: 0.5rem; background: #f9fafb; border-radius: 0.5rem; }
        .sport-activity { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; padding: 0.3rem; background: white; border-radius: 0.35rem; border: 2px solid #e5e7eb; }
        .sport-checkbox { width: 1.2rem; height: 1.2rem; cursor: pointer; }
        .sport-label { flex: 1; font-weight: 600; font-size: 0.85rem; }
        .sport-time-input { width: 4rem; text-align: center; font-size: 1.1rem; font-weight: 700; padding: 0.3rem; border: 2px solid #d1d5db; border-radius: 0.35rem; cursor: pointer; background: white; }
        .sport-time-input:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
        .sport-time-unit { font-size: 0.75rem; color: #6b7280; font-weight: 600; }
        .rating-box { margin: 0.75rem 0; padding: 1rem; border-radius: 0.75rem; }
        .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
        .stress-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
        .rating-cell { border: 2px solid #d1d5db; border-radius: 0.5rem; padding: 0.5rem 0.25rem; background: white; cursor: pointer; text-align: center; font-weight: 600; }
        .rating-cell:hover { border-color: #9ca3af; }
        .rating-num { font-size: 1rem; margin-bottom: 0.25rem; }
        .rating-emoji { font-size: 0.65rem; margin-bottom: 0.15rem; }
        .rating-text { font-size: 0.55rem; }
        .r1 { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
        .r2 { border-color: #f59e0b; background: #fef3c7; color: #92400e; }
        .r3 { border-color: #eab308; background: #fef9c3; color: #854d0e; }
        .r4 { border-color: #84cc16; background: #f7fee7; color: #3f6212; }
        .r5 { border-color: #22c55e; background: #dcfce7; color: #166534; }
        .divider { border-top: 2px solid #e5e7eb; margin: 1rem 0; }
        .hint { text-align: center; margin-top: 0.25rem; font-size: 0.75rem; color: #9ca3af; }
        .weight-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.15rem; margin-top: 0.3rem; }
        .weight-btn { border: 2px solid #d1d5db; border-radius: 0.3rem; padding: 0.1rem 0.05rem; font-weight: 600; background: white; cursor: pointer; font-size: 0.6rem; }
        .weight-btn.selected { border-color: #8b5cf6; background: #ede9fe; color: #5b21b6; }
        .viz-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.08rem; margin-bottom: 0.5rem; }
        .viz-day { height: 2rem; border-radius: 0.15rem; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }
        .viz-day-number { font-size: 0.85rem; }
        .viz-day-emoji { font-size: 1rem; }
        .viz-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.08rem; margin-bottom: 0.2rem; }
        .viz-weekday { text-align: center; font-size: 0.75rem; font-weight: 800; color: #374151; }
        .viz-month-nav { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .viz-month-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
        .viz-month-title-main { font-size: 1.3rem; font-weight: 800; }
        .viz-month-stats { font-size: 0.9rem; font-weight: 700; display: flex; gap: 0.3rem; }
        .viz-month-container { margin-bottom: 1rem; }
        .viz-nav-btn { background: #3b82f6; color: white; border: none; border-radius: 0.35rem; padding: 0.3rem 0.6rem; font-weight: 600; cursor: pointer; font-size: 0.65rem; }
        .viz-nav-btn:disabled { background: #d1d5db; cursor: not-allowed; }
        .viz-legend { display: flex; justify-content: center; gap: 1rem; font-size: 0.7rem; }
        .viz-legend-item { display: flex; align-items: center; gap: 0.25rem; }
        .viz-legend-box { width: 1rem; height: 1rem; border-radius: 0.25rem; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 1rem; padding: 1.5rem; max-width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 2px solid #e5e7eb; }
        .modal-title { font-size: 1.1rem; font-weight: bold; }
        .modal-close { background: #ef4444; color: white; border: none; border-radius: 0.5rem; padding: 0.4rem 0.8rem; font-weight: 600; cursor: pointer; }
        .modal-section { margin-bottom: 1rem; }
        .modal-section-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; }
        .modal-items { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .modal-item { font-size: 0.8rem; }
        .time-popup-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .time-popup { background: white; border-radius: 1.5rem; padding: 1.5rem; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .time-popup-header { text-align: center; margin-bottom: 1.5rem; }
        .time-popup-title { font-size: 1.2rem; font-weight: bold; color: #1f2937; margin-bottom: 0.5rem; }
        .time-popup-display { font-size: 4rem; font-weight: 900; color: #16a34a; text-align: center; margin-bottom: 1rem; }
        .time-popup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .time-popup-btn { background: #f3f4f6; border: 2px solid #d1d5db; border-radius: 0.75rem; padding: 1rem; font-size: 1.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .time-popup-btn:active { transform: scale(0.95); background: #e5e7eb; }
        .time-popup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .time-popup-clear { background: #ef4444; color: white; border: none; border-radius: 0.5rem; padding: 0.75rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .time-popup-save { background: #22c55e; color: white; border: none; border-radius: 0.5rem; padding: 0.75rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        let appState = {
            entries: (() => {
                try {
                    return JSON.parse(localStorage.getItem('healthEntries') || '[]');
                } catch (e) {
                    console.error('Fehler beim Laden der Daten:', e);
                    return [];
                }
            })(),
            selectedDate: new Date().toISOString().split('T')[0],
            formData: { 
                dayRating: null, 
                stress: null, 
                sport: null, 
                sportActivities: {}, // Format: {type: minutes}
                smoking: null, 
                alcohol: null, 
                food: null, 
                iceBath: null, 
                healthy: null, 
                floss: null, 
                reading: null, 
                carbs: null, 
                protein: null, 
                sauna: null, 
                weight: null 
            },
            showHistory: false, 
            showViz: true, 
            vizMonth: 0, 
            vizYear: 2026, 
            modalEntry: null,
            timePopup: null
        };

        const SPORT_TYPES = ['Rudern', 'Laufen', 'Kraftsport', 'Dehnen', 'Wandern', 'Schwimmen'];

        function setRating(v) { appState.formData.dayRating = v; renderApp(); }
        function setStress(v) { appState.formData.stress = v; renderApp(); }
        function setSport(v) { 
            appState.formData.sport = v; 
            if (!v) appState.formData.sportActivities = {}; 
            renderApp(); 
        }
        function setFormField(f, v) { appState.formData[f] = v; renderApp(); }
        function setDate(d) { appState.selectedDate = d; loadEntryForDate(); renderApp(); }

        function toggleSportType(type) {
            if (appState.formData.sportActivities[type] !== undefined) {
                delete appState.formData.sportActivities[type];
            } else {
                appState.formData.sportActivities[type] = 0;
            }
            renderApp();
        }

        function openTimePopup(type) {
            appState.timePopup = {
                type: type,
                value: (appState.formData.sportActivities[type] || 0).toString()
            };
            renderApp();
        }

        function closeTimePopup() {
            appState.timePopup = null;
            renderApp();
        }

        function addDigitToTime(digit) {
            if (!appState.timePopup) return;
            let newValue = appState.timePopup.value + digit;
            if (parseInt(newValue) <= 999) {
                appState.timePopup.value = parseInt(newValue).toString();
                renderApp();
            }
        }

        function clearTime() {
            if (!appState.timePopup) return;
            appState.timePopup.value = '0';
            renderApp();
        }

        function saveTime() {
            if (!appState.timePopup) return;
            const type = appState.timePopup.type;
            const value = parseInt(appState.timePopup.value) || 0;
            if (value > 0) {
                appState.formData.sportActivities[type] = value;
            } else {
                delete appState.formData.sportActivities[type];
            }
            closeTimePopup();
        }

        function loadEntryForDate() {
            const e = appState.entries.find(e => e.date === appState.selectedDate);
            if (e) {
                let sportActs = {};
                
                // Neue Format (sportActivities als Object)
                if (e.sportActivities && typeof e.sportActivities === 'object' && !Array.isArray(e.sportActivities)) {
                    sportActs = {...e.sportActivities};
                }
                // Alte Formate konvertieren
                else if (e.sportActivities && Array.isArray(e.sportActivities)) {
                    e.sportActivities.forEach(act => {
                        if (act.type && act.duration) {
                            const minutes = parseDuration(act.duration);
                            if (minutes > 0) sportActs[act.type] = minutes;
                        }
                    });
                }
                else if (e.sportTypes && Array.isArray(e.sportTypes)) {
                    const minutes = parseDuration(e.sportDuration || '30min');
                    e.sportTypes.forEach(type => {
                        sportActs[type] = minutes;
                    });
                }
                
                appState.formData = { 
                    dayRating: e.dayRating||null, 
                    stress: e.stress||null, 
                    sport: e.sport, 
                    sportActivities: sportActs, 
                    smoking: !e.noSmoking, 
                    alcohol: !e.noAlcohol, 
                    food: e.healthyFood, 
                    iceBath: e.iceBath, 
                    healthy: e.healthy, 
                    floss: e.floss||null, 
                    reading: e.reading||null, 
                    carbs: e.carbs||null, 
                    protein: e.protein||null, 
                    sauna: e.sauna||null, 
                    weight: e.weight||null 
                };
            } else {
                appState.formData = { 
                    dayRating: null, 
                    stress: null, 
                    sport: null, 
                    sportActivities: {}, 
                    smoking: null, 
                    alcohol: null, 
                    food: null, 
                    iceBath: null, 
                    healthy: null, 
                    floss: null, 
                    reading: null, 
                    carbs: null, 
                    protein: null, 
                    sauna: null, 
                    weight: null 
                };
            }
        }

        function parseDuration(dur) {
            if (!dur) return 30;
            const match = dur.match(/(\d+)/);
            if (!match) return 30;
            const num = parseInt(match[1]);
            if (dur.includes('h')) return num * 60;
            return num;
        }

        function isFormComplete() {
            const sportValid = appState.formData.sport === false || 
                              (appState.formData.sport === true && 
                               Object.keys(appState.formData.sportActivities).length > 0 &&
                               Object.values(appState.formData.sportActivities).every(m => m > 0));
            
            return appState.formData.dayRating !== null && 
                   appState.formData.stress !== null && 
                   sportValid && 
                   appState.formData.smoking !== null && 
                   appState.formData.alcohol !== null && 
                   appState.formData.food !== null && 
                   appState.formData.iceBath !== null && 
                   appState.formData.healthy !== null && 
                   appState.formData.floss !== null && 
                   appState.formData.reading !== null && 
                   appState.formData.carbs !== null && 
                   appState.formData.protein !== null && 
                   appState.formData.sauna !== null;
        }

        function handleSubmit() {
            if (!isFormComplete()) return;
            const dt = appState.selectedDate;
            const pts = (appState.formData.sport?1:0) + (!appState.formData.smoking?1:0) + (!appState.formData.alcohol?1:0) + (appState.formData.food?1:0);
            const entry = {
                date: dt, 
                dayRating: appState.formData.dayRating, 
                stress: appState.formData.stress, 
                sport: appState.formData.sport,
                sportActivities: appState.formData.sport ? {...appState.formData.sportActivities} : {},
                noSmoking: !appState.formData.smoking, 
                noAlcohol: !appState.formData.alcohol, 
                healthyFood: appState.formData.food,
                iceBath: appState.formData.iceBath, 
                healthy: appState.formData.healthy, 
                floss: appState.formData.floss, 
                reading: appState.formData.reading,
                carbs: appState.formData.carbs, 
                protein: appState.formData.protein, 
                sauna: appState.formData.sauna, 
                weight: appState.formData.weight,
                points: pts, 
                timestamp: new Date().toISOString()
            };
            appState.entries = appState.entries.filter(e => e.date !== dt);
            appState.entries.push(entry);
            appState.entries.sort((a,b) => new Date(b.date) - new Date(a.date));
            try {
                localStorage.setItem('healthEntries', JSON.stringify(appState.entries));
            } catch (e) {
                console.error('Fehler beim Speichern:', e);
                alert('Fehler beim Speichern der Daten. Bitte Browser-Einstellungen prüfen.');
            }
            appState.selectedDate = new Date().toISOString().split('T')[0];
            appState.formData = { 
                dayRating: null, 
                stress: null, 
                sport: null, 
                sportActivities: {}, 
                smoking: null, 
                alcohol: null, 
                food: null, 
                iceBath: null, 
                healthy: null, 
                floss: null, 
                reading: null, 
                carbs: null, 
                protein: null, 
                sauna: null, 
                weight: null 
            };
            renderApp();
        }

        function exportData() {
            const csv = ['Datum,Tagesbewertung,Stress,Sport,Sportaktivitäten,Nicht geraucht,Kein Alkohol,Gesund gegessen,Eisbad,Gesund,Zahnpflege,Gelesen,Sauna,Carbs,Protein,Gewicht,Punkte,Zeitstempel',
                ...appState.entries.map(e => {
                    let sp = '';
                    if (e.sportActivities) {
                        if (typeof e.sportActivities === 'object' && !Array.isArray(e.sportActivities)) {
                            // Neues Format
                            sp = Object.entries(e.sportActivities).map(([type, min]) => `${type}: ${min}min`).join('; ');
                        } else if (Array.isArray(e.sportActivities)) {
                            // Altes Array-Format
                            sp = e.sportActivities.map(a => `${a.type}: ${a.duration}`).join('; ');
                        }
                    } else if (e.sportTypes && Array.isArray(e.sportTypes)) {
                        // Ganz altes Format
                        sp = `${e.sportTypes.join(', ')} (${e.sportDuration || 'Gesamt'})`;
                    }
                    return `${e.date},${e.dayRating||''},${e.stress||''},${e.sport?'Ja':'Nein'},"${sp}",${e.noSmoking?'Ja':'Nein'},${e.noAlcohol?'Ja':'Nein'},${e.healthyFood?'Ja':'Nein'},${e.iceBath?'Ja':'Nein'},${e.healthy?'Ja':'Nein'},${e.floss?'Ja':'Nein'},${e.reading?'Ja':'Nein'},${e.sauna?'Ja':'Nein'},${e.carbs||''},${e.protein||''},${e.weight||''},${e.points},${e.timestamp||''}`;
                })
            ].join('\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
            a.download = `health_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        function toggleHistory() { appState.showHistory = !appState.showHistory; renderApp(); }
        function toggleViz() { appState.showViz = !appState.showViz; renderApp(); }
        function changeVizMonth(d) { appState.vizMonth += d; if (appState.vizMonth < 0) { appState.vizMonth = 11; appState.vizYear--; } else if (appState.vizMonth > 11) { appState.vizMonth = 0; appState.vizYear++; } renderApp(); }
        function showDayModal(d) { const e = appState.entries.find(e => e.date === d); if (!e) return; appState.modalEntry = e; renderApp(); }
        function closeModal() { appState.modalEntry = null; const m = document.querySelector('.modal-overlay'); if (m) m.remove(); renderApp(); }
        function editEntry(d) { appState.selectedDate = d; loadEntryForDate(); window.scrollTo({top:0,behavior:'smooth'}); renderApp(); }

        function formatSportActivities(sportActs) {
            if (!sportActs) return '';
            if (typeof sportActs === 'object' && !Array.isArray(sportActs)) {
                return Object.entries(sportActs).map(([type, min]) => `${type} ${min}min`).join(', ');
            }
            if (Array.isArray(sportActs)) {
                return sportActs.map(a => `${a.type} ${a.duration}`).join(', ');
            }
            return '';
        }

        function renderApp() {
            try {
                appState.entries = JSON.parse(localStorage.getItem('healthEntries') || '[]');
            } catch (e) {
                console.error('Fehler beim Laden:', e);
                appState.entries = [];
            }
            const yr = new Date().getFullYear();
            const ye = appState.entries.filter(e => new Date(e.date).getFullYear() === yr);
            const stats = {
                total: appState.entries.length > 0 ? (appState.entries.reduce((s,e) => s + e.points, 0) / appState.entries.length).toFixed(1) : 0,
                week: (() => { const l = appState.entries.slice(0,7); return l.length > 0 ? (l.reduce((s,e) => s + e.points, 0) / l.length).toFixed(1) : 0; })(),
                yearRating: (() => { const y = ye.filter(e => e.dayRating); return y.length > 0 ? (y.reduce((s,e) => s + e.dayRating, 0) / y.length).toFixed(1) : 0; })()
            };

            const getYS = (f) => { const y = ye.filter(e => e[f] === true).length; const n = ye.filter(e => e[f] === false).length; return {yes: y, no: n, percent: ye.length > 0 ? ((y/ye.length)*100).toFixed(0) : 0}; };
            const ys = {sport: getYS('sport'), noSmoking: getYS('noSmoking'), noAlcohol: getYS('noAlcohol'), healthyFood: getYS('healthyFood'), iceBath: getYS('iceBath'), healthy: getYS('healthy'), floss: getYS('floss'), reading: getYS('reading'), sauna: getYS('sauna')};

            const getMonthDays = (o) => {
                let m = appState.vizMonth + o, y = appState.vizYear;
                if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
                const days = [];
                const offset = new Date(y, m, 1).getDay() === 0 ? 6 : new Date(y, m, 1).getDay() - 1;
                for (let i = 0; i < offset; i++) days.push({empty:true});
                for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
                    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const e = appState.entries.find(e => e.date === ds);
                    days.push({date: ds, day: d, entry: e, points: e?.points, rating: e?.dayRating});
                }
                return {days, month: m, year: y};
            };

            const mn = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
            const getRE = (r) => ['','😞','😕','😐','😊','🤩'][r]||'';
            const getSE = (s) => ['','😫','😟','😌','😊'][s]||'';
            const getDC = (p) => p === null ? '#f3f4f6' : ['#fecaca','#fed7aa','#fef08a','#bef264','#86efac'][p]||'#f3f4f6';
            const getMS = (md) => { const e = md.days.filter(d=>d.entry).map(d=>d.entry); if (!e.length) return {avg:0,trend:'neutral'}; const avg = (e.reduce((s,e)=>s+e.points,0)/e.length).toFixed(1); const mid = Math.floor(e.length/2); if (!mid) return {avg,trend:'neutral'}; const a1 = e.slice(0,mid).reduce((s,e)=>s+e.points,0)/mid; const a2 = e.slice(mid).reduce((s,e)=>s+e.points,0)/(e.length-mid); const d = a2-a1; return {avg, trend: d>0.3?'up':d<-0.3?'down':'neutral'}; };
            const getTI = (t) => t==='up'?'▲':t==='down'?'▼':'▬';
            const getTC = (t) => t==='up'?'#22c55e':t==='down'?'#ef4444':'#f59e0b';

            document.getElementById('app').innerHTML = `
                <div class="card">
                    <div class="header"><div class="title">🏃 Health Tracker</div></div>
                    <div class="stats">
                        <div class="stat-box green"><div class="stat-label">Gesamt-Ø</div><div class="stat-value green">${stats.total}</div><div class="stat-sub">von 4 Pkt</div></div>
                        <div class="stat-box blue"><div class="stat-label">7-Tage-Ø</div><div class="stat-value blue">${stats.week}</div><div class="stat-sub">letzte Woche</div></div>
                        <div class="stat-box orange"><div class="stat-label">⭐ 2026</div><div class="stat-value orange">${stats.yearRating}</div><div class="stat-sub">Ø Bewertung</div></div>
                    </div>
                </div>

                <div class="card">
                    <label class="label">📅 Datum</label>
                    <input type="date" class="input-date" value="${appState.selectedDate}" onchange="setDate(this.value)" max="${new Date().toISOString().split('T')[0]}">
                    
                    <div class="rating-box" style="background:#fef3c7">
                        <label class="label">⭐ Wie war dein Tag insgesamt?</label>
                        <div class="rating-grid">${[1,2,3,4,5].map(r => `<div onclick="setRating(${r})" class="rating-cell ${appState.formData.dayRating===r?'r'+r:''}"><div class="rating-num">${r}</div><div class="rating-emoji">${getRE(r)}</div><div class="rating-text">${['','Katastrophe','Schlecht','Geht so','Gut','Perfekt'][r]}</div></div>`).join('')}</div>
                    </div>

                    <div class="rating-box" style="background:#fef2f2">
                        <label class="label">😰 Wie viel negativen Stress gab es heute?</label>
                        <div class="stress-grid">${[1,2,3,4].map(s => `<div onclick="setStress(${s})" class="rating-cell ${appState.formData.stress===s?'r'+[1,2,4,5][s-1]:''}"><div class="rating-num">${s}</div><div class="rating-emoji">${getSE(s)}</div><div class="rating-text">${['','Sehr viel','Etwas','Wenig','Kein'][s]}</div></div>`).join('')}</div>
                    </div>

                    <div class="questions">
                        <div class="question-row"><div class="emoji">🏃</div><div class="question-label">Sport</div><div class="buttons"><button onclick="setSport(true)" class="q-btn ${appState.formData.sport===true?'green':''}">✅</button><button onclick="setSport(false)" class="q-btn ${appState.formData.sport===false?'red':''}">❌</button></div><div class="stats-mini">${ys.sport.percent}% <span class="stats-count"><span class="good">${ys.sport.yes}</span>/<span class="bad">${ys.sport.no}</span></span></div></div>
                        ${appState.formData.sport === true ? `<div class="sport-details">${SPORT_TYPES.map(type => {
                            const isChecked = appState.formData.sportActivities[type] !== undefined;
                            const minutes = appState.formData.sportActivities[type] || 0;
                            return `<div class="sport-activity">
                                <input type="checkbox" class="sport-checkbox" ${isChecked?'checked':''} onchange="toggleSportType('${type}')">
                                <span class="sport-label">${type}</span>
                                <input type="text" class="sport-time-input" value="${minutes}" ${!isChecked?'disabled':''} onclick="${isChecked?`openTimePopup('${type}')`:''}" readonly>
                                <span class="sport-time-unit">min</span>
                            </div>`;
                        }).join('')}</div>` : ''}
                        <div class="question-row"><div class="emoji">🚭</div><div class="question-label">Kein Rauchen</div><div class="buttons"><button onclick="setFormField('smoking',false)" class="q-btn ${appState.formData.smoking===false?'green':''}">✅</button><button onclick="setFormField('smoking',true)" class="q-btn ${appState.formData.smoking===true?'red':''}">❌</button></div><div class="stats-mini">${ys.noSmoking.percent}% <span class="stats-count"><span class="good">${ys.noSmoking.yes}</span>/<span class="bad">${ys.noSmoking.no}</span></span></div></div>
                        <div class="question-row"><div class="emoji">🍺</div><div class="question-label">Kein Alkohol</div><div class="buttons"><button onclick="setFormField('alcohol',false)" class="q-btn ${appState.formData.alcohol===false?'green':''}">✅</button><button onclick="setFormField('alcohol',true)" class="q-btn ${appState.formData.alcohol===true?'red':''}">❌</button></div><div class="stats-mini">${ys.noAlcohol.percent}% <span class="stats-count"><span class="good">${ys.noAlcohol.yes}</span>/<span class="bad">${ys.noAlcohol.no}</span></span></div></div>
                        <div class="question-row"><div class="emoji">🥗</div><div class="question-label">Ernährung</div><div class="buttons"><button onclick="setFormField('food',true)" class="q-btn ${appState.formData.food===true?'green':''}">✅</button><button onclick="setFormField('food',false)" class="q-btn ${appState.formData.food===false?'red':''}">❌</button></div><div class="stats-mini">${ys.healthyFood.percent}% <span class="stats-count"><span class="good">${ys.healthyFood.yes}</span>/<span class="bad">${ys.healthyFood.no}</span></span></div></div>
                        
                        <div class="divider"></div>
                        
                        <div class="question-row faded"><div class="emoji">🧊</div><div class="question-label">Eisbad</div><div class="buttons"><button onclick="setFormField('iceBath',true)" class="q-btn ${appState.formData.iceBath===true?'green':''}">✅</button><button onclick="setFormField('iceBath',false)" class="q-btn ${appState.formData.iceBath===false?'red':''}">❌</button></div><div class="stats-mini">${ys.iceBath.percent}% <span class="stats-count"><span class="good">${ys.iceBath.yes}</span>/<span class="bad">${ys.iceBath.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">💪</div><div class="question-label">Gesund</div><div class="buttons"><button onclick="setFormField('healthy',true)" class="q-btn ${appState.formData.healthy===true?'green':''}">✅</button><button onclick="setFormField('healthy',false)" class="q-btn ${appState.formData.healthy===false?'red':''}">❌</button></div><div class="stats-mini">${ys.healthy.percent}% <span class="stats-count"><span class="good">${ys.healthy.yes}</span>/<span class="bad">${ys.healthy.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">🦷</div><div class="question-label">Zahnpflege</div><div class="buttons"><button onclick="setFormField('floss',true)" class="q-btn ${appState.formData.floss===true?'green':''}">✅</button><button onclick="setFormField('floss',false)" class="q-btn ${appState.formData.floss===false?'red':''}">❌</button></div><div class="stats-mini">${ys.floss.percent}% <span class="stats-count"><span class="good">${ys.floss.yes}</span>/<span class="bad">${ys.floss.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">📖</div><div class="question-label">Lesen</div><div class="buttons"><button onclick="setFormField('reading',true)" class="q-btn ${appState.formData.reading===true?'green':''}">✅</button><button onclick="setFormField('reading',false)" class="q-btn ${appState.formData.reading===false?'red':''}">❌</button></div><div class="stats-mini">${ys.reading.percent}% <span class="stats-count"><span class="good">${ys.reading.yes}</span>/<span class="bad">${ys.reading.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">🧖</div><div class="question-label">Sauna</div><div class="buttons"><button onclick="setFormField('sauna',true)" class="q-btn ${appState.formData.sauna===true?'green':''}">✅</button><button onclick="setFormField('sauna',false)" class="q-btn ${appState.formData.sauna===false?'red':''}">❌</button></div><div class="stats-mini">${ys.sauna.percent}% <span class="stats-count"><span class="good">${ys.sauna.yes}</span>/<span class="bad">${ys.sauna.no}</span></span></div></div>
                        
                        <div class="divider"></div>
                        
                        <div class="question-row faded"><div class="emoji">🍞</div><div class="question-label">Carbs</div><div class="buttons"><button onclick="setFormField('carbs','low')" class="q-btn ${appState.formData.carbs==='low'?'low':''}">Low</button><button onclick="setFormField('carbs','medium')" class="q-btn ${appState.formData.carbs==='medium'?'medium':''}">Med</button><button onclick="setFormField('carbs','high')" class="q-btn ${appState.formData.carbs==='high'?'high':''}">High</button></div><div class="stats-mini">-</div></div>
                        <div class="question-row faded"><div class="emoji">🥩</div><div class="question-label">Protein</div><div class="buttons"><button onclick="setFormField('protein','low')" class="q-btn ${appState.formData.protein==='low'?'prot-low':''}">Low</button><button onclick="setFormField('protein','medium')" class="q-btn ${appState.formData.protein==='medium'?'prot-med':''}">Med</button><button onclick="setFormField('protein','high')" class="q-btn ${appState.formData.protein==='high'?'prot-high':''}">High</button></div><div class="stats-mini">-</div></div>
                        
                        <div class="hint">🧊, 💪, 🦷, 📖, 🧖, 🍞 und 🥩 zählen nicht in Punkte</div>
                    </div>

                    <div style="margin-top:1rem;padding:0.75rem;background:#f3f4f6;border-radius:0.5rem">
                        <label class="label">⚖️ Gewicht (optional)</label>
                        <div class="weight-grid">${[91,90,89,88,87,86,85,84].map(w => `<button onclick="setFormField('weight',${w})" class="weight-btn ${appState.formData.weight===w?'selected':''}">${w}kg</button>`).join('')}</div>
                    </div>

                    <button onclick="handleSubmit()" ${isFormComplete()?'':'disabled'} class="${isFormComplete()?'btn-green':'btn-gray'}">${isFormComplete()?'✅ Eintragen':'⏳ Alle beantworten'}</button>
                </div>

                <button onclick="toggleViz()" class="btn-toggle"><div>📊 Visualisierung</div><span>${appState.showViz?'▼':'▶'}</span></button>
                ${appState.showViz ? `<div class="card"><div class="viz-month-nav"><button onclick="changeVizMonth(-1)" class="viz-nav-btn" ${appState.vizYear===2026&&appState.vizMonth===0?'disabled':''}>◀ Zurück</button><div></div><button onclick="changeVizMonth(1)" class="viz-nav-btn" ${appState.vizYear===new Date().getFullYear()&&appState.vizMonth===new Date().getMonth()?'disabled':''}>Vor ▶</button></div>${[-1,0,1].map(o => { const md = getMonthDays(o); if (md.year < 2026) return ''; const st = getMS(md); return `<div class="viz-month-container"><div class="viz-month-title"><div class="viz-month-title-main">${mn[md.month]} ${md.year}</div><div class="viz-month-stats"><span style="color:#16a34a">${st.avg}</span><span style="color:${getTC(st.trend)};font-size:1.2rem">${getTI(st.trend)}</span></div></div><div class="viz-weekdays">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div class="viz-weekday">${d}</div>`).join('')}</div><div class="viz-grid">${md.days.map(d => d.empty ? '<div></div>' : `<div class="viz-day" style="background:${getDC(d.points)};color:#374151" onclick="showDayModal('${d.date}')"><div class="viz-day-number">${d.day}</div>${d.rating?`<div class="viz-day-emoji">${getRE(d.rating)}</div>`:''}</div>`).join('')}</div></div>`; }).join('')}<div class="viz-legend">${[{c:'#86efac',t:'4'},{c:'#bef264',t:'3'},{c:'#fef08a',t:'2'},{c:'#fed7aa',t:'1'},{c:'#fecaca',t:'0'},{c:'#f3f4f6',t:'-'}].map(l => `<div class="viz-legend-item"><div class="viz-legend-box" style="background:${l.c}"></div><span>${l.t}</span></div>`).join('')}</div></div>` : ''}

                <button onclick="toggleHistory()" class="btn-toggle"><div>📅 Verlauf (${appState.entries.length})</div><span>${appState.showHistory?'▼':'▶'}</span></button>
                ${appState.showHistory ? `<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:0.75rem"><h2 style="font-size:1rem;font-weight:bold">Alle Einträge</h2><button onclick="exportData()" style="color:#3b82f6;font-weight:600;background:none;border:none;cursor:pointer">Export</button></div>${appState.entries.map(e => {
                    const sportText = formatSportActivities(e.sportActivities) || (e.sportTypes ? e.sportTypes.join(', ') : '');
                    return `<div style="border:2px solid #f3f4f6;border-radius:0.5rem;padding:0.625rem;margin-bottom:0.5rem"><div style="display:flex;justify-content:space-between"><div style="font-weight:600;font-size:0.875rem">${new Date(e.date).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})} ${e.dayRating?`⭐${e.dayRating}`:''} ${e.stress?`😰${e.stress}`:''}</div><div style="display:flex;gap:0.5rem;align-items:center"><div style="font-size:1.25rem;font-weight:bold;color:#16a34a">${e.points}</div><button onclick="editEntry('${e.date}')" style="color:#3b82f6;background:none;border:none;cursor:pointer">✏️</button></div></div><div style="display:flex;gap:0.5rem;font-size:0.75rem;margin-top:0.375rem">${e.sport?'🏃✅':'🏃❌'} ${e.noSmoking?'🚭✅':'🚭❌'} ${e.noAlcohol?'🍺✅':'🍺❌'} ${e.healthyFood?'🥗✅':'🥗❌'} ${e.iceBath?'🧊✅':'🧊❌'} ${e.healthy?'💪✅':'💪❌'} ${e.floss?'🦷✅':'🦷❌'} ${e.reading?'📖✅':'📖❌'} ${e.sauna?'🧖✅':'🧖❌'}</div>${sportText?`<div style="font-size:0.7rem;color:#6b7280;margin-top:0.25rem">🏃 ${sportText}</div>`:''}</div>`;
                }).join('')}</div>` : ''}
            `;

            if (appState.modalEntry) {
                const m = document.createElement('div');
                m.className = 'modal-overlay';
                const sportText = formatSportActivities(appState.modalEntry.sportActivities) || (appState.modalEntry.sportTypes ? `${appState.modalEntry.sportTypes.join(', ')} ${appState.modalEntry.sportDuration||''}` : '');
                m.innerHTML = `<div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">${new Date(appState.modalEntry.date).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div><button class="modal-close" id="closeBtn">✕</button></div><div class="modal-section"><div class="modal-section-title">⭐ Tagesbewertung</div><div style="font-size:2rem">${getRE(appState.modalEntry.dayRating)} ${appState.modalEntry.dayRating||'?'}/5</div></div>${appState.modalEntry.stress?`<div class="modal-section"><div class="modal-section-title">😰 Stress</div><div style="font-size:2rem">${getSE(appState.modalEntry.stress)} ${appState.modalEntry.stress}/4</div></div>`:''}<div class="modal-section"><div class="modal-section-title">💪 Punktefragen (${appState.modalEntry.points}/4)</div><div class="modal-items"><div class="modal-item" style="color:${appState.modalEntry.sport?'#16a34a':'#ef4444'}">🏃 ${appState.modalEntry.sport?'✅':'❌'} Sport ${sportText?`<span style="color:#3b82f6;font-size:0.7rem">(${sportText})</span>`:''}</div><div class="modal-item" style="color:${appState.modalEntry.noSmoking?'#16a34a':'#ef4444'}">🚭 ${appState.modalEntry.noSmoking?'✅':'❌'}</div><div class="modal-item" style="color:${appState.modalEntry.noAlcohol?'#16a34a':'#ef4444'}">🍺 ${appState.modalEntry.noAlcohol?'✅':'❌'}</div><div class="modal-item" style="color:${appState.modalEntry.healthyFood?'#16a34a':'#ef4444'}">🥗 ${appState.modalEntry.healthyFood?'✅':'❌'}</div></div></div><div class="modal-section"><div class="modal-section-title">📋 Zusatz</div><div class="modal-items"><div class="modal-item">🧊 ${appState.modalEntry.iceBath?'✅':'❌'}</div><div class="modal-item">💪 ${appState.modalEntry.healthy?'Gesund':'Krank'}</div><div class="modal-item">🦷 ${appState.modalEntry.floss?'✅':'❌'}</div><div class="modal-item">📖 ${appState.modalEntry.reading?'✅':'❌'}</div><div class="modal-item">🧖 ${appState.modalEntry.sauna?'✅':'❌'}</div><div class="modal-item">🍞 ${appState.modalEntry.carbs||'?'}</div><div class="modal-item" style="color:${appState.modalEntry.protein==='low'?'#ef4444':appState.modalEntry.protein==='medium'?'#f59e0b':appState.modalEntry.protein==='high'?'#22c55e':'#9ca3af'}">🥩 ${appState.modalEntry.protein||'?'}</div>${appState.modalEntry.weight?`<div class="modal-item">⚖️ ${appState.modalEntry.weight}kg</div>`:''}</div></div><button id="editBtn" style="width:100%;background:#3b82f6;color:white;border:none;border-radius:0.5rem;padding:0.75rem;font-weight:600;cursor:pointer">✏️ Bearbeiten</button></div>`;
                document.body.appendChild(m);
                m.addEventListener('click', function(e) { if (e.target === m) closeModal(); });
                document.getElementById('closeBtn').addEventListener('click', function(e) { e.stopPropagation(); closeModal(); });
                document.getElementById('editBtn').addEventListener('click', function(e) { e.stopPropagation(); const d = appState.modalEntry.date; closeModal(); editEntry(d); });
            }

            if (appState.timePopup) {
                const tp = document.createElement('div');
                tp.className = 'time-popup-overlay';
                tp.innerHTML = `<div class="time-popup" onclick="event.stopPropagation()">
                    <div class="time-popup-header">
                        <div class="time-popup-title">⏱️ ${appState.timePopup.type}</div>
                        <div style="font-size:0.9rem;color:#6b7280">Minuten eingeben (0-999)</div>
                    </div>
                    <div class="time-popup-display">${appState.timePopup.value} min</div>
                    <div class="time-popup-grid">
                        ${[1,2,3,4,5,6,7,8,9,'C',0,'✓'].map(d => {
                            if (d === 'C') return '<button class="time-popup-btn" onclick="clearTime()" style="background:#fef2f2;color:#ef4444">⌫</button>';
                            if (d === '✓') return '<button class="time-popup-btn" onclick="saveTime()" style="background:#dcfce7;color:#16a34a">✓</button>';
                            return `<button class="time-popup-btn" onclick="addDigitToTime('${d}')">${d}</button>`;
                        }).join('')}
                    </div>
                </div>`;
                document.body.appendChild(tp);
                tp.addEventListener('click', function(e) { if (e.target === tp) closeTimePopup(); });
            }
        }

        // Sicherstellen, dass DOM vollständig geladen ist
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                loadEntryForDate();
                renderApp();
            });
        } else {
            loadEntryForDate();
            renderApp();
        }
    </script>
</body>
</html>
