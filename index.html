        @keyframes slideIn { from { transform: translateX(-50%) translateY(-100%); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

<body>
    <div id="app"></div>
    <script>
        let appState = {
            entries: JSON.parse(localStorage.getItem('healthEntries') || '[]'),
            selectedDate: new Date().toISOString().split('T')[0],
            formData: { dayRating: null, stress: null, sport: null, sportTypes: [], sportDuration: null, smoking: null, alcohol: null, food: null, iceBath: null, healthy: null, floss: null, reading: null, carbs: null, protein: null, weight: null },
            showHistory: false,
            showViz: true,
            vizMonth: 0,
            vizYear: 2026,
            modalEntry: null
        };

        function setRating(val) { appState.formData.dayRating = val; renderApp(); }
        function setStress(val) { appState.formData.stress = val; renderApp(); }
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function toggleSportType(type) { const idx = appState.formData.sportTypes.indexOf(type); if (idx > -1) appState.formData.sportTypes.splice(idx, 1); else appState.formData.sportTypes.push(type); renderApp(); }
        function setSportDuration(dur) { appState.formData.sportDuration = dur; renderApp(); }
        function addSportActivity() {
            appState.formData.sportActivities.push({ type: '', duration: '' });
            renderApp();
        }
        function removeSportActivity(index) {
            appState.formData.sportActivities.splice(index, 1);
            renderApp();
        }
        function updateSportActivity(index, field, value) {
            appState.formData.sportActivities[index][field] = value;
            renderApp();
        }
        function setSport(val) { 
            appState.formData.sport = val; 
            if (!val) {
                appState.formData.sportActivities = [];
            } else if (appState.formData.sportActivities.length === 0) {
                appState.formData.sportActivities = [{ type: '', duration: '' }];
            }
            renderApp(); 
        }
        function setFormField(field, value) { appState.formData[field] = value; renderApp(); }
        function setDate(date) { appState.selectedDate = date; loadEntryForDate(); renderApp(); }

        function loadEntryForDate() {
            const entry = appState.entries.find(e => e.date === appState.selectedDate);
            if (entry) {
                appState.formData = {
                    dayRating: entry.dayRating || null,
                    stress: entry.stress || null,
                    sport: entry.sport,
                    sportTypes: entry.sportTypes || [],
                    sportDuration: entry.sportDuration || null,
                    smoking: !entry.noSmoking,
                    alcohol: !entry.noAlcohol,
                    food: entry.healthyFood,
                    iceBath: entry.iceBath,
                    healthy: entry.healthy,
                    floss: entry.floss || null,
                    reading: entry.reading || null,
                    carbs: entry.carbs || null,
                    protein: entry.protein || null,
                    sauna: entry.sauna || null,
                    weight: entry.weight || null
                };
            } else {
                appState.formData = { dayRating: null, stress: null, sport: null, sportTypes: [], sportDuration: null, smoking: null, alcohol: null, food: null, iceBath: null, healthy: null, floss: null, reading: null, carbs: null, protein: null, sauna: null, weight: null };
            }
        }

        function isFormComplete() {
            const sportComplete = appState.formData.sport === false || (appState.formData.sport === true && appState.formData.sportActivities.length > 0 && appState.formData.sportActivities.every(a => a.type && a.duration));
            return appState.formData.dayRating !== null && appState.formData.stress !== null && sportComplete && appState.formData.smoking !== null && appState.formData.alcohol !== null && appState.formData.food !== null && appState.formData.iceBath !== null && appState.formData.healthy !== null && appState.formData.floss !== null && appState.formData.reading !== null && appState.formData.carbs !== null && appState.formData.protein !== null && appState.formData.sauna !== null;
        }

        function handleSubmit() {
            if (!isFormComplete()) return alert('Bitte beantworte alle Fragen!');
            
            const dateToSave = appState.selectedDate; // Datum sichern!
            
            const points = (appState.formData.sport ? 1 : 0) + (!appState.formData.smoking ? 1 : 0) + (!appState.formData.alcohol ? 1 : 0) + (appState.formData.food ? 1 : 0);
            const entry = {
                date: dateToSave,
                dayRating: appState.formData.dayRating, 
                stress: appState.formData.stress,
                sport: appState.formData.sport, 
                sportTypes: appState.formData.sport ? appState.formData.sportTypes : [], 
                sportDuration: appState.formData.sport ? appState.formData.sportDuration : null,
                noSmoking: !appState.formData.smoking, 
                noAlcohol: !appState.formData.alcohol, 
                healthyFood: appState.formData.food,
                iceBath: appState.formData.iceBath, 
                healthy: appState.formData.healthy, 
                floss: appState.formData.floss, 
                reading: appState.formData.reading,
                carbs: appState.formData.carbs, 
                protein: appState.formData.protein,
                sauna: appState.formData.sauna,
                weight: appState.formData.weight,
                points, 
                timestamp: new Date().toISOString()
            };
            
            // Entferne alten Eintrag für dieses Datum
            appState.entries = appState.entries.filter(e => e.date !== dateToSave);
            appState.entries.push(entry);
            appState.entries.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('healthEntries', JSON.stringify(appState.entries));
            
            // WICHTIG: Formular komplett zurücksetzen UND Datum auf heute
            appState.selectedDate = new Date().toISOString().split('T')[0];
            appState.formData = { dayRating: null, stress: null, sport: null, sportTypes: [], sportDuration: null, smoking: null, alcohol: null, food: null, iceBath: null, healthy: null, floss: null, reading: null, carbs: null, protein: null, sauna: null, weight: null };
            
            // Erfolgs-Nachricht mit Debug-Info
            alert(`✅ Eintrag gespeichert!\n\nDatum: ${new Date(dateToSave).toLocaleDateString('de-DE')}\nPunkte: ${points}\nRating: ${appState.formData.dayRating || '?'}`);
            
            renderApp();
        }

        function exportData() {
            const csv = ['Datum,Tagesbewertung,Stress,Sport,Sportarten,Dauer,Nicht geraucht,Kein Alkohol,Gesund gegessen,Eisbad,Gesund,Zahnpflege,Gelesen,Carbs,Protein,Sauna,Gewicht,Punkte,Zeitstempel',
                ...appState.entries.map(e => `${e.date},${e.dayRating || ''},${e.stress || ''},${e.sport ? 'Ja' : 'Nein'},"${(e.sportTypes || []).join(';')}",${e.sportDuration || ''},${e.noSmoking ? 'Ja' : 'Nein'},${e.noAlcohol ? 'Ja' : 'Nein'},${e.healthyFood ? 'Ja' : 'Nein'},${e.iceBath ? 'Ja' : 'Nein'},${e.healthy ? 'Ja' : 'Nein'},${e.floss ? 'Ja' : 'Nein'},${e.reading ? 'Ja' : 'Nein'},${e.carbs || ''},${e.protein || ''},${e.sauna ? 'Ja' : 'Nein'},${e.weight || ''},${e.points},${e.timestamp || ''}`)
            ].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `health_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        function toggleHistory() { appState.showHistory = !appState.showHistory; renderApp(); }
        function toggleViz() { appState.showViz = !appState.showViz; renderApp(); }
        function changeVizMonth(delta) { appState.vizMonth += delta; if (appState.vizMonth < 0) { appState.vizMonth = 11; appState.vizYear--; } else if (appState.vizMonth > 11) { appState.vizMonth = 0; appState.vizYear++; } renderApp(); }
        function showDayModal(date) { const entry = appState.entries.find(e => e.date === date); if (!entry) return; appState.modalEntry = entry; renderApp(); }
        function closeModal() { 
            appState.modalEntry = null; 
            const existing = document.querySelector('.modal-overlay');
            if (existing) existing.remove();
            renderApp(); 
        }
        function editEntry(date) { appState.selectedDate = date; loadEntryForDate(); window.scrollTo({ top: 0, behavior: 'smooth' }); renderApp(); }

        function renderApp() {
            // Entries NEU aus localStorage laden um sicherzustellen dass wir die aktuellsten Daten haben
            appState.entries = JSON.parse(localStorage.getItem('healthEntries') || '[]');
            
            const yr = new Date().getFullYear();
            const ye = appState.entries.filter(e => new Date(e.date).getFullYear() === yr);
            const stats = {
                total: appState.entries.length > 0 ? (appState.entries.reduce((s, e) => s + e.points, 0) / appState.entries.length).toFixed(1) : 0,
                week: (() => { const l7 = appState.entries.slice(0, 7); return l7.length > 0 ? (l7.reduce((s, e) => s + e.points, 0) / l7.length).toFixed(1) : 0; })(),
                yearRating: (() => { const yRat = ye.filter(e => e.dayRating); return yRat.length > 0 ? (yRat.reduce((s, e) => s + e.dayRating, 0) / yRat.length).toFixed(1) : 0; })()
            };

            const getYS = (f, neg = false) => { const y = ye.filter(e => e[f] === !neg).length; const n = ye.filter(e => e[f] === neg).length; return { yes: y, no: n, percent: ye.length > 0 ? ((y / ye.length) * 100).toFixed(0) : 0 }; };
            const yearStats = { sport: getYS('sport'), noSmoking: getYS('noSmoking'), noAlcohol: getYS('noAlcohol'), healthyFood: getYS('healthyFood'), iceBath: getYS('iceBath'), healthy: getYS('healthy'), floss: getYS('floss'), reading: getYS('reading'), sauna: getYS('sauna') };

            const getMonthDays = (o) => {
                // WICHTIG: Verwende die aktuellen Entries aus appState
                const currentEntries = appState.entries;
                
                let m = appState.vizMonth + o, y = appState.vizYear;
                if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
                const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
                const offset = first.getDay() === 0 ? 6 : first.getDay() - 1;
                const days = [];
                for (let i = 0; i < offset; i++) days.push({ empty: true });
                for (let d = 1; d <= last.getDate(); d++) {
                    // Datum-String direkt erstellen ohne Timezone-Probleme
                    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const entry = currentEntries.find(e => e.date === dateStr);
                    days.push({ date: dateStr, day: d, entry, points: entry?.points, rating: entry?.dayRating });
                }
                return { days, month: m, year: y };
            };

            const monthNames = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
            const getRatingEmoji = (r) => ['', '😞', '😕', '😐', '😊', '🤩'][r] || '';
            const getStressEmoji = (s) => ['', '😫', '😟', '😌', '😊'][s] || '';
            const getDayColor = (p) => p === null ? '#f3f4f6' : ['#fecaca', '#fed7aa', '#fef08a', '#bef264', '#86efac'][p] || '#f3f4f6';
            
            const getMonthStats = (md) => {
                const ent = md.days.filter(d => d.entry).map(d => d.entry);
                if (ent.length === 0) return { avg: 0, trend: 'neutral' };
                const avg = (ent.reduce((s, e) => s + e.points, 0) / ent.length).toFixed(1);
                const mid = Math.floor(ent.length / 2);
                if (mid === 0) return { avg, trend: 'neutral' };
                const a1 = ent.slice(0, mid).reduce((s, e) => s + e.points, 0) / mid;
                const a2 = ent.slice(mid).reduce((s, e) => s + e.points, 0) / (ent.length - mid);
                const diff = a2 - a1;
                return { avg, trend: diff > 0.3 ? 'up' : diff < -0.3 ? 'down' : 'neutral' };
            };

            const getTrendIcon = (t) => t === 'up' ? '▲' : t === 'down' ? '▼' : '▬';
            const getTrendColor = (t) => t === 'up' ? '#22c55e' : t === 'down' ? '#ef4444' : '#f59e0b';

            document.getElementById('app').innerHTML = `
                <div class="card">
                    <div class="header"><div class="title">🏃 Health Tracker</div></div>
                    <div class="stats">
                        <div class="stat-box green"><div class="stat-label">Gesamt-Ø</div><div class="stat-value green">${stats.total}</div><div class="stat-sub">von 4 Pkt</div></div>
                        <div class="stat-box blue"><div class="stat-label">7-Tage-Ø</div><div class="stat-value blue">${stats.week}</div><div class="stat-sub">letzte Woche</div></div>
                        <div class="stat-box orange"><div class="stat-label">⭐ 2026</div><div class="stat-value orange">${stats.yearRating}</div><div class="stat-sub">Ø Bewertung</div></div>
                    </div>
                </div>

                <div class="card">
                    <label class="label">📅 Datum</label>
                    <input type="date" class="input-date" value="${appState.selectedDate}" onchange="setDate(this.value)" max="${new Date().toISOString().split('T')[0]}">
                    
                    <div class="rating-box" style="background:#fef3c7">
                        <label class="label">⭐ Wie war dein Tag insgesamt?</label>
                        <div class="rating-grid">
                            ${[1,2,3,4,5].map(r => `<div onclick="setRating(${r})" class="rating-cell ${appState.formData.dayRating === r ? 'r'+r : ''}"><div class="rating-num">${r}</div><div class="rating-emoji">${getRatingEmoji(r)}</div><div class="rating-text">${['','Katastrophe','Schlecht','Geht so','Gut','Perfekt'][r]}</div></div>`).join('')}
                        </div>
                    </div>

                    <div class="rating-box" style="background:#fef2f2">
                        <label class="label">😰 Wie viel negativen Stress gab es heute?</label>
                        <div class="stress-grid">
                            ${[1,2,3,4].map(s => `<div onclick="setStress(${s})" class="rating-cell ${appState.formData.stress === s ? 'r'+[1,2,4,5][s-1] : ''}"><div class="rating-num">${s}</div><div class="rating-emoji">${getStressEmoji(s)}</div><div class="rating-text">${['','Sehr viel','Etwas','Wenig','Kein'][s]}</div></div>`).join('')}
                        </div>
                    </div>

                    <div class="questions">
                        <div class="question-row"><div class="emoji">🏃</div><div class="question-label">Sport</div><div class="buttons"><button onclick="setSport(true)" class="q-btn ${appState.formData.sport === true ? 'green' : ''}">✅</button><button onclick="setSport(false)" class="q-btn ${appState.formData.sport === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.sport.percent}% <span class="stats-count"><span class="good">${yearStats.sport.yes}</span>/<span class="bad">${yearStats.sport.no}</span></span></div></div>
                        ${appState.formData.sport === true ? `<div class="sport-details">
                            <div style="font-size:0.7rem;font-weight:600;margin-bottom:0.5rem">Aktivitäten (mit je eigener Zeit):</div>
                            ${appState.formData.sportActivities.map((activity, i) => `
                                <div class="sport-activity">
                                    <select onchange="updateSportActivity(${i},'type',this.value)" class="sport-type-select">
                                        <option value="">Wähle Sportart...</option>
                                        ${['Rudern','Laufen','Kraftsport','Dehnen','Wandern','Schwimmen'].map(t => `<option value="${t}" ${activity.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                                    </select>
                                    <select onchange="updateSportActivity(${i},'duration',this.value)" class="sport-duration-select">
                                        <option value="">Zeit...</option>
                                        ${['15min','30min','45min','1h','1h15','1h30','1h45','2h'].map(d => `<option value="${d}" ${activity.duration === d ? 'selected' : ''}>${d}</option>`).join('')}
                                    </select>
                                    <button onclick="removeSportActivity(${i})" class="sport-remove-btn">✕</button>
                                </div>
                            `).join('')}
                            <button onclick="addSportActivity()" class="sport-add-btn">+ Aktivität hinzufügen</button>
                        </div>` : ''}
                        <div class="question-row"><div class="emoji">🚭</div><div class="question-label">Kein Rauchen</div><div class="buttons"><button onclick="setFormField('smoking',false)" class="q-btn ${appState.formData.smoking === false ? 'green' : ''}">✅</button><button onclick="setFormField('smoking',true)" class="q-btn ${appState.formData.smoking === true ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.noSmoking.percent}% <span class="stats-count"><span class="good">${yearStats.noSmoking.yes}</span>/<span class="bad">${yearStats.noSmoking.no}</span></span></div></div>
                        <div class="question-row"><div class="emoji">🍺</div><div class="question-label">Kein Alkohol</div><div class="buttons"><button onclick="setFormField('alcohol',false)" class="q-btn ${appState.formData.alcohol === false ? 'green' : ''}">✅</button><button onclick="setFormField('alcohol',true)" class="q-btn ${appState.formData.alcohol === true ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.noAlcohol.percent}% <span class="stats-count"><span class="good">${yearStats.noAlcohol.yes}</span>/<span class="bad">${yearStats.noAlcohol.no}</span></span></div></div>
                        <div class="question-row"><div class="emoji">🥗</div><div class="question-label">Ernährung</div><div class="buttons"><button onclick="setFormField('food',true)" class="q-btn ${appState.formData.food === true ? 'green' : ''}">✅</button><button onclick="setFormField('food',false)" class="q-btn ${appState.formData.food === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.healthyFood.percent}% <span class="stats-count"><span class="good">${yearStats.healthyFood.yes}</span>/<span class="bad">${yearStats.healthyFood.no}</span></span></div></div>
                        
                        <div style="border-top:2px solid #e5e7eb;margin:1rem 0"></div>
                        
                        <div class="question-row faded"><div class="emoji">🧊</div><div class="question-label">Eisbad</div><div class="buttons"><button onclick="setFormField('iceBath',true)" class="q-btn ${appState.formData.iceBath === true ? 'green' : ''}">✅</button><button onclick="setFormField('iceBath',false)" class="q-btn ${appState.formData.iceBath === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.iceBath.percent}% <span class="stats-count"><span class="good">${yearStats.iceBath.yes}</span>/<span class="bad">${yearStats.iceBath.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">💪</div><div class="question-label">Gesund</div><div class="buttons"><button onclick="setFormField('healthy',true)" class="q-btn ${appState.formData.healthy === true ? 'green' : ''}">✅</button><button onclick="setFormField('healthy',false)" class="q-btn ${appState.formData.healthy === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.healthy.percent}% <span class="stats-count"><span class="good">${yearStats.healthy.yes}</span>/<span class="bad">${yearStats.healthy.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">🦷</div><div class="question-label">Zahnpflege</div><div class="buttons"><button onclick="setFormField('floss',true)" class="q-btn ${appState.formData.floss === true ? 'green' : ''}">✅</button><button onclick="setFormField('floss',false)" class="q-btn ${appState.formData.floss === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.floss.percent}% <span class="stats-count"><span class="good">${yearStats.floss.yes}</span>/<span class="bad">${yearStats.floss.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">📖</div><div class="question-label">Lesen</div><div class="buttons"><button onclick="setFormField('reading',true)" class="q-btn ${appState.formData.reading === true ? 'green' : ''}">✅</button><button onclick="setFormField('reading',false)" class="q-btn ${appState.formData.reading === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.reading.percent}% <span class="stats-count"><span class="good">${yearStats.reading.yes}</span>/<span class="bad">${yearStats.reading.no}</span></span></div></div>
                        <div class="question-row faded"><div class="emoji">🧖</div><div class="question-label">Sauna</div><div class="buttons"><button onclick="setFormField('sauna',true)" class="q-btn ${appState.formData.sauna === true ? 'green' : ''}">✅</button><button onclick="setFormField('sauna',false)" class="q-btn ${appState.formData.sauna === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.sauna ? `${yearStats.sauna.percent}% <span class="stats-count"><span class="good">${yearStats.sauna.yes}</span>/<span class="bad">${yearStats.sauna.no}</span></span>` : '0%'}</div></div>
                        
                        <div style="border-top:2px solid #e5e7eb;margin:1rem 0"></div>
                        
                        <div class="question-row faded"><div class="emoji">🍞</div><div class="question-label">Carbs</div><div class="buttons"><button onclick="setFormField('carbs','low')" class="q-btn ${appState.formData.carbs === 'low' ? 'low' : ''}">Low</button><button onclick="setFormField('carbs','medium')" class="q-btn ${appState.formData.carbs === 'medium' ? 'medium' : ''}">Med</button><button onclick="setFormField('carbs','high')" class="q-btn ${appState.formData.carbs === 'high' ? 'high' : ''}">High</button></div><div class="stats-mini">-</div></div>
                        <div class="question-row faded"><div class="emoji">🥩</div><div class="question-label">Protein</div><div class="buttons"><button onclick="setFormField('protein','low')" class="q-btn ${appState.formData.protein === 'low' ? 'prot-low' : ''}">Low</button><button onclick="setFormField('protein','medium')" class="q-btn ${appState.formData.protein === 'medium' ? 'prot-med' : ''}">Med</button><button onclick="setFormField('protein','high')" class="q-btn ${appState.formData.protein === 'high' ? 'prot-high' : ''}">High</button></div><div class="stats-mini">-</div></div>
                        <div class="question-row faded"><div class="emoji">🧖</div><div class="question-label">Sauna</div><div class="buttons"><button onclick="setFormField('sauna',true)" class="q-btn ${appState.formData.sauna === true ? 'green' : ''}">✅</button><button onclick="setFormField('sauna',false)" class="q-btn ${appState.formData.sauna === false ? 'red' : ''}">❌</button></div><div class="stats-mini">${yearStats.sauna ? `${yearStats.sauna.percent}% <span class="stats-count"><span class="good">${yearStats.sauna.yes}</span>/<span class="bad">${yearStats.sauna.no}</span></span>` : '0%'}</div></div>
                        <div class="hint">🧊, 💪, 🦷, 📖, 🍞, 🥩 und 🧖 zählen nicht in Punkte</div>
                    </div>

                    <div style="margin-top:1rem;padding:0.75rem;background:#f3f4f6;border-radius:0.5rem">
                        <label class="label">⚖️ Gewicht (optional)</label>
                        <div class="weight-grid">${[91,90,89,88,87,86,85,84].map(w => `<button onclick="setFormField('weight',${w})" class="weight-btn ${appState.formData.weight === w ? 'selected' : ''}">${w}kg</button>`).join('')}</div>
                    </div>

                    <button onclick="handleSubmit()" ${isFormComplete() ? '' : 'disabled'} class="${isFormComplete() ? 'btn-green' : 'btn-gray'}">${isFormComplete() ? '✅ Eintragen' : '⏳ Alle beantworten'}</button>
                </div>

                <button onclick="toggleViz()" class="btn-toggle"><div>📊 Visualisierung</div><span>${appState.showViz ? '▼' : '▶'}</span></button>
                ${appState.showViz ? `<div class="card"><div class="viz-month-nav"><button onclick="changeVizMonth(-1)" class="viz-nav-btn" ${appState.vizYear === 2026 && appState.vizMonth === 0 ? 'disabled' : ''}>◀ Zurück</button><div></div><button onclick="changeVizMonth(1)" class="viz-nav-btn" ${appState.vizYear === new Date().getFullYear() && appState.vizMonth === new Date().getMonth() ? 'disabled' : ''}>Vor ▶</button></div>${[-1,0,1].map(o => { const md = getMonthDays(o); if (md.year < 2026) return ''; const st = getMonthStats(md); return `<div class="viz-month-container"><div class="viz-month-title"><div class="viz-month-title-main">${monthNames[md.month]} ${md.year}</div><div class="viz-month-stats"><span style="color:#16a34a">${st.avg}</span><span style="color:${getTrendColor(st.trend)};font-size:1.2rem">${getTrendIcon(st.trend)}</span></div></div><div class="viz-weekdays">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div class="viz-weekday">${d}</div>`).join('')}</div><div class="viz-grid">${md.days.map(d => d.empty ? '<div></div>' : `<div class="viz-day" style="background:${getDayColor(d.points)};color:#374151" onclick="showDayModal('${d.date}')"><div class="viz-day-number">${d.day}</div>${d.rating ? `<div class="viz-day-emoji">${getRatingEmoji(d.rating)}</div>` : ''}</div>`).join('')}</div></div>`; }).join('')}<div class="viz-legend">${[{c:'#86efac',t:'4'},{c:'#bef264',t:'3'},{c:'#fef08a',t:'2'},{c:'#fed7aa',t:'1'},{c:'#fecaca',t:'0'},{c:'#f3f4f6',t:'-'}].map(l => `<div class="viz-legend-item"><div class="viz-legend-box" style="background:${l.c}"></div><span>${l.t}</span></div>`).join('')}</div></div>` : ''}

                <button onclick="toggleHistory()" class="btn-toggle"><div>📅 Verlauf (${appState.entries.length})</div><span>${appState.showHistory ? '▼' : '▶'}</span></button>
                ${appState.showHistory ? `<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:0.75rem"><h2 style="font-size:1rem;font-weight:bold">Alle Einträge</h2><button onclick="exportData()" style="color:#3b82f6;font-weight:600;background:none;border:none;cursor:pointer">Export</button></div>${appState.entries.map(e => `<div style="border:2px solid #f3f4f6;border-radius:0.5rem;padding:0.625rem;margin-bottom:0.5rem"><div style="display:flex;justify-content:space-between"><div style="font-weight:600;font-size:0.875rem">${new Date(e.date).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})} ${e.dayRating ? `⭐${e.dayRating}` : ''} ${e.stress ? `😰${e.stress}` : ''}</div><div style="display:flex;gap:0.5rem;align-items:center"><div style="font-size:1.25rem;font-weight:bold;color:#16a34a">${e.points}</div><button onclick="editEntry('${e.date}')" style="color:#3b82f6;background:none;border:none;cursor:pointer">✏️</button></div></div><div style="display:flex;gap:0.5rem;font-size:0.75rem;margin-top:0.375rem">${e.sport ? '🏃✅' : '🏃❌'} ${e.noSmoking ? '🚭✅' : '🚭❌'} ${e.noAlcohol ? '🍺✅' : '🍺❌'} ${e.healthyFood ? '🥗✅' : '🥗❌'} ${e.iceBath ? '🧊✅' : '🧊❌'} ${e.healthy ? '💪✅' : '💪❌'} ${e.floss ? '🦷✅' : '🦷❌'} ${e.reading ? '📖✅' : '📖❌'} ${e.sauna ? '🧖✅' : '🧖❌'}</div></div>`).join('')}</div>` : ''}
            `;

            if (appState.modalEntry) {
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `<div class="modal-content" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">${new Date(appState.modalEntry.date).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div><button class="modal-close" id="closeBtn">✕</button></div><div class="modal-section"><div class="modal-section-title">⭐ Tagesbewertung</div><div style="font-size:2rem">${getRatingEmoji(appState.modalEntry.dayRating)} ${appState.modalEntry.dayRating || '?'}/5</div></div>${appState.modalEntry.stress ? `<div class="modal-section"><div class="modal-section-title">😰 Stress</div><div style="font-size:2rem">${getStressEmoji(appState.modalEntry.stress)} ${appState.modalEntry.stress}/4</div></div>` : ''}<div class="modal-section"><div class="modal-section-title">💪 Punktefragen (${appState.modalEntry.points}/4)</div><div class="modal-items">                            <div class="modal-item" style="color:${appState.modalEntry.sport ? '#16a34a' : '#ef4444'}">
                                🏃 ${appState.modalEntry.sport ? '✅' : '❌'} Sport 
                                ${appState.modalEntry.sportActivities?.length ? 
                                    `<span style="color:#3b82f6;font-size:0.7rem">(${appState.modalEntry.sportActivities.map(a => `${a.type} ${a.duration}`).join(', ')})</span>` : 
                                    appState.modalEntry.sportTypes?.length ? `<span style="color:#3b82f6;font-size:0.7rem">(${appState.modalEntry.sportTypes.join(', ')} ${appState.modalEntry.sportDuration || ''})</span>` : ''}
                            </div><div class="modal-item" style="color:${appState.modalEntry.noSmoking ? '#16a34a' : '#ef4444'}">🚭 ${appState.modalEntry.noSmoking ? '✅' : '❌'}</div><div class="modal-item" style="color:${appState.modalEntry.noAlcohol ? '#16a34a' : '#ef4444'}">🍺 ${appState.modalEntry.noAlcohol ? '✅' : '❌'}</div><div class="modal-item" style="color:${appState.modalEntry.healthyFood ? '#16a34a' : '#ef4444'}">🥗 ${appState.modalEntry.healthyFood ? '✅' : '❌'}</div></div></div>                        <div class="modal-section"><div class="modal-section-title">📋 Zusatz</div><div class="modal-items"><div class="modal-item">🧊 ${appState.modalEntry.iceBath ? '✅' : '❌'}</div><div class="modal-item">💪 ${appState.modalEntry.healthy ? 'Gesund' : 'Krank'}</div><div class="modal-item">🦷 ${appState.modalEntry.floss ? '✅' : '❌'}</div><div class="modal-item">📖 ${appState.modalEntry.reading ? '✅' : '❌'}</div><div class="modal-item">🍞 ${appState.modalEntry.carbs || '?'}</div><div class="modal-item" style="color:${appState.modalEntry.protein === 'low' ? '#ef4444' : appState.modalEntry.protein === 'medium' ? '#f59e0b' : appState.modalEntry.protein === 'high' ? '#22c55e' : '#9ca3af'}">🥩 ${appState.modalEntry.protein || '?'}</div><div class="modal-item">🧖 ${appState.modalEntry.sauna ? '✅' : '❌'}</div>${appState.modalEntry.weight ? `<div class="modal-item">⚖️ ${appState.modalEntry.weight}kg</div>` : ''}</div></div><button id="editBtn" style="width:100%;background:#3b82f6;color:white;border:none;border-radius:0.5rem;padding:0.75rem;font-weight:600;cursor:pointer">✏️ Bearbeiten</button></div>`;
                document.body.appendChild(modal);
                
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
                
                document.getElementById('closeBtn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    closeModal();
                });
                
                document.getElementById('editBtn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    const d = appState.modalEntry.date;
                    closeModal();
                    editEntry(d);
                });
            }
        }

        loadEntryForDate();
        renderApp();
    </script>
</body>
</html>
